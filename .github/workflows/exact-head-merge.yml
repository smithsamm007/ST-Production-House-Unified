name: Exact-Head Merge Controller

on:
  workflow_run:
    workflows:
      - ST Production House CI
      - PR Gate
      - Autonomous Merge Referee
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: exact-head-merge-global
  cancel-in-progress: false

jobs:
  evaluate-and-merge:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/commits/$EXPECTED_HEAD/pulls" --jq '[.[] | select(.state == "open" and .base.ref == "main")][0].number // empty')"
          fi
          if [ -z "$pr_number" ]; then
            echo "No open main pull request is associated with this exact head."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$main_sha" -f per_page=100 > main-runs.json
          if ! jq -e '[.workflow_runs[] | select(.name == "ST Production House CI" and .status == "completed" and .conclusion == "success")] | length > 0' main-runs.json >/dev/null; then
            echo "Current main $main_sha has not passed post-merge CI; no PR may merge yet."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPOSITORY/pulls/$pr_number" > pull.json
            if [ "$(jq -r '.mergeable' pull.json)" != "null" ]; then
              break
            fi
            sleep "$((attempt * 2))"
          done

          gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$EXPECTED_HEAD" -f per_page=100 > workflow-runs.json
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Evaluate every exact-head gate
        id: first_gate
        if: steps.pr.outputs.found == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/merge-controller.mjs pull.json workflow-runs.json "$EXPECTED_HEAD"

      - name: Re-fetch and re-evaluate immediately before merge
        id: final_gate
        if: steps.first_gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pull-final.json
            if [ "$(jq -r '.mergeable' pull-final.json)" != "null" ]; then
              break
            fi
            sleep "$((attempt * 2))"
          done

          gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$EXPECTED_HEAD" -f per_page=100 > workflow-runs-final.json
          node .github/scripts/merge-controller.mjs pull-final.json workflow-runs-final.json "$EXPECTED_HEAD"

      - name: Merge the still-current exact head
        if: steps.final_gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$current_head" = "$EXPECTED_HEAD"
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD"
          gh workflow run ci.yml --repo "$REPOSITORY" --ref main
