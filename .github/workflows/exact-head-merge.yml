name: Exact-Head Merge Controller

on:
  workflow_run:
    workflows:
      - ST Production House CI
      - PR Gate
      - Autonomous Merge Referee
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: exact-head-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  evaluate-and-merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            echo "No pull request is associated with this workflow run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPOSITORY/pulls/$pr_number" > pull.json
          gh api -X GET "repos/$REPOSITORY/actions/runs"             -f head_sha="$EXPECTED_HEAD" -f event="pull_request" -f per_page=100 > workflow-runs.json
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Evaluate every exact-head gate
        id: first_gate
        if: steps.pr.outputs.found == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/merge-controller.mjs pull.json workflow-runs.json "$EXPECTED_HEAD"

      - name: Re-fetch and re-evaluate immediately before merge
        id: final_gate
        if: steps.first_gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pull-final.json
          gh api -X GET "repos/$REPOSITORY/actions/runs"             -f head_sha="$EXPECTED_HEAD" -f event="pull_request" -f per_page=100 > workflow-runs-final.json
          node .github/scripts/merge-controller.mjs pull-final.json workflow-runs-final.json "$EXPECTED_HEAD"

      - name: Merge the still-current exact head
        if: steps.final_gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$current_head" = "$EXPECTED_HEAD"
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD"
