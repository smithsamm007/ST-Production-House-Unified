name: Post-Merge Lane Reverification

on:
  workflow_run:
    workflows: [ST Production House CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: post-merge-lane-reverification
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reverify every remaining autonomous lane against verified main
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label autopilot --json number,headRefName,headRefOid --jq '.[] | [.number,.headRefName,.headRefOid] | @tsv' |
          while IFS=$'\t' read -r number branch head; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f pr_number="$number" -f expected_head="$head"
            gh workflow run pr-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f pr_number="$number" -f expected_head="$head"
            gh workflow run autonomous-merge.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f pr_number="$number" -f expected_head="$head"
            echo "::notice::Dispatched post-main exact-head gates for PR #$number at $head."
          done
