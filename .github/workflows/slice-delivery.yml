name: Slice Delivery Reconciler

# Turns already-written slice work into pull requests so the existing governed
# merge path (CI -> PR Gate -> Merge Referee -> exact-head merge) can finish it.
# Without this stage a slice whose code sits on a branch never reaches any gate,
# because all three gates react to pull_request events only.
#
# It never merges, never closes branches and never records completion: it opens
# at most one pull request per run, respects the one-PR rule, and leaves every
# competing implementation to the owner (AGENTS.md Rules 1-3, 7, 16, 17).

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only: report the decisions without opening anything'
        type: boolean
        default: false

permissions:
  # Least privilege: this workflow opens pull requests and dispatches gates.
  # It never pushes, so contents stays read-only.
  actions: write
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: st-slice-delivery
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate reconciler contracts
        run: |
          node --check src/automation/sliceDelivery.js
          node --check .github/scripts/slice-delivery-reconciler.mjs

      - name: Reconcile slice delivery
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node .github/scripts/slice-delivery-reconciler.mjs

      - name: Publish delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-delivery-report
          path: artifacts/automation/slice-delivery-report.json
          if-no-files-found: warn
          retention-days: 30
