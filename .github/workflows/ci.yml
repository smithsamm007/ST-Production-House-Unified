name: ST Production House CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://st_app:st_test_password@localhost:5432/st_production_test
      POSTGRES_TEST_URL: postgresql://st_app:st_test_password@localhost:5432/st_production_test
      MFA_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: st_app
          POSTGRES_PASSWORD: st_test_password
          POSTGRES_DB: st_production_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run verification checks
      run: npm run verify

    - name: Run unit and policy tests
      run: npm test

    - name: Run PostgreSQL Integration Tests
      run: npm run test:integration
