name: ST Production House CI

on:
  push:
    branches: [ main, feat/agent-digital-identity-isolation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run verification checks
      run: npm run verify

    - name: Run unit and policy tests
      run: npm test
