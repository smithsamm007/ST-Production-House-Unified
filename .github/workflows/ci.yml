name: ST Production House CI

on:
  push:
    branches: [ main, feat/agent-digital-identity-isolation, feat/production-postgresql-adapter, feat/postgres-authenticated-api-8899318215390372394 ]
  pull_request:
    branches: [ main, feat/production-postgresql-adapter, feat/postgres-authenticated-api-8899318215390372394 ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: st_app
          POSTGRES_PASSWORD: st_test_password
          POSTGRES_DB: st_production_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies (Deterministic)
      run: npm ci

    - name: Run verification checks
      run: npm run verify

    - name: Run unit and policy tests
      run: npm test

    - name: Run PostgreSQL 15 Integration Tests (Distinct Required Step)
      env:
        POSTGRES_TEST_URL: postgresql://st_app:st_test_password@localhost:5432/st_production_test
      run: npm run test:integration
