name: AutoDev
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement-issue:
    if: github.event.label.name == 'auto-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.AUTODEV_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.AUTODEV_TOKEN }}" }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci || npm install

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pipx install aider-chat

      - name: Implement issue (working tree only, nothing published yet)
        run: |
          BRANCH="auto/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          git config user.name  "autodev-bot"
          git config user.email "autodev[bot]@users.noreply.github.com"
          gh issue view ${{ github.event.issue.number }} --json body -q .body > /tmp/task.md
          aider --model openrouter/deepseek/deepseek-r1:free \
                --yes-always --no-auto-commits \
                --message-file /tmp/task.md \
                CONVENTIONS.md
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Coding agent produced no repository change; nothing to publish."
            exit 1
          fi

      # Truthful publishing gate (issue #90): the implementation is verified
      # BEFORE any commit, push, or PR. A failing tree is never published and
      # no success is claimed; the workflow fails here, loudly.
      - name: Verify before publishing
        run: |
          npm test 2>&1 | tee /tmp/npm-test.log
          npm run verify 2>&1 | tee /tmp/npm-verify.log

      - name: Commit and push verified implementation
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          git add -A
          git commit -m "feat: resolve #${{ github.event.issue.number }} [autodev]"
          git push origin "$branch"

      - name: Open draft PR with real evidence
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          {
            printf 'Closes #%s\n\n⚠️ Automated implementation — owner review required.\n\n## Verification\n\n### npm test\n\n```text\n' "${{ github.event.issue.number }}"
            tail -n 40 /tmp/npm-test.log
            printf '\n```\n\n### npm run verify\n\n```text\n'
            tail -n 40 /tmp/npm-verify.log
            printf '\n```\n'
          } > /tmp/pr-body.md
          gh pr create --draft --base main \
            --head "$branch" \
            --title "AutoDev: issue #${{ github.event.issue.number }}" \
            --body-file /tmp/pr-body.md
