name: Jules Ready-Issue Autopilot Launcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: st-jules-ready-issue-launcher
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const [owner, repo] = process.env.REPO.split("/");
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            if (prs.length > 0) {
              core.info("A PR is already in flight; Jules launch skipped.");
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ready", per_page: 100
            });
            const candidates = issues
              .filter(i => /^\[S-[A-Z0-9]+-[A-Z0-9]+\] /.test(i.title))
              .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
            const issue = candidates[0];
            if (!issue) {
              core.info("No eligible ready slice issue exists.");
              return;
            }

            const match = issue.title.match(/^\[([^\]]+)\] /);
            if (!match) throw new Error("Ready issue has no slice id.");
            const slice = match[1];
            const path = `automation/jules-commands/task-${issue.number}-slice-${slice}.json`;

            let existing = null;
            try {
              existing = await github.rest.repos.getContent({owner, repo, path, ref:"main"});
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            if (existing) {
              core.info(`Command already exists: ${path}`);
              return;
            }

            const command = {
              tracking_issue: issue.number,
              attempt: 1,
              starting_branch: "main",
              title: issue.title,
              prompt: issue.body || ""
            };
            if (!command.prompt) throw new Error("Ready issue has no body.");

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chore(automation): queue Jules slice ${slice} [${issue.number}]`,
              content: Buffer.from(JSON.stringify(command, null, 2) + "\n").toString("base64"),
              branch: "main"
            });
            core.info(`Queued exactly one Jules slice: ${slice} (issue #${issue.number}).`);
