name: Android Build & Tests

# The owner console (app/**) previously had NO automated verification: every
# CI job was Node/PostgreSQL, so a Kotlin change could merge on review alone.
# This workflow compiles the app and runs its JVM unit tests in a real
# JDK 21 / Android SDK 36 / Gradle 9.3.1 environment (the versions the
# project actually declares: README build system + jvmToolchain(21) +
# compileSdk 36).
#
# Honest evidence (AGENTS.md Rule 1): this job is the ONLY place the Android
# build is verified — the implementation sandbox has no JDK or Android SDK,
# so nothing here claims a local build that never ran.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "debug.keystore"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "debug.keystore"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (app declares jvmToolchain(21))
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK package manager
        id: sdk
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "::error::No Android SDK on the runner (ANDROID_HOME/ANDROID_SDK_ROOT unset)."
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "path=$(command -v sdkmanager)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::sdkmanager not found under $SDK_ROOT."
          exit 1

      - name: Install platform 36 and build-tools (compileSdk 36)
        run: |
          set -euo pipefail
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null || true
          "${{ steps.sdk.outputs.path }}" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1 (documented build system; no wrapper in repo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create the debug keystore when it is absent
        # app/build.gradle.kts signs debug builds with <rootDir>/debug.keystore,
        # which has never been committed (correctly: a signing key is not
        # source). A throwaway debug key is generated for the build only.
        run: |
          set -euo pipefail
          if [ -f debug.keystore ]; then
            echo "debug.keystore already present; nothing to generate."
            exit 0
          fi
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated a throwaway debug keystore for CI (debug builds only)."

      - name: Build debug APK and run JVM unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.xml
          if-no-files-found: warn
          retention-days: 14
