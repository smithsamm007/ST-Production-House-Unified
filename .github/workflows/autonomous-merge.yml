name: Autonomous Merge Referee

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: string
      expected_head:
        description: Exact forty-character PR head SHA
        required: true
        type: string

permissions:
  # `gh pr merge` merges the pull request (contents: write) and arms
  # auto-merge (pull-requests: write). A workflow that declares a permissions
  # block gets `none` for every scope it omits, so the previous read-only pair
  # made these calls fail with 403 while the job still reported success.
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: autonomous-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  referee:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://st_app:st_test_password@localhost:5432/st_production_test
      POSTGRES_TEST_URL: postgresql://st_app:st_test_password@localhost:5432/st_production_test
      MFA_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: st_app
          POSTGRES_PASSWORD: st_test_password
          POSTGRES_DB: st_production_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Validate dispatched pull request identity
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$actual")" = open
          test "$(jq -r '.draft' <<<"$actual")" = false
          test "$(jq -r '.base.ref' <<<"$actual")" = main
          test "$(jq -r '.head.sha' <<<"$actual")" = "$EXPECTED_HEAD"

      - name: Reject draft pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::Draft pull requests are never merge-eligible."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Integrate current main for dispatched verification
        if: github.event_name == 'workflow_dispatch'
        run: git merge --no-commit --no-ff origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exact-head dependencies
        run: npm ci

      - name: Validate development roadmap
        run: npm run plan:check

      - name: Verify exact head
        run: npm run verify

      - name: Run exact-head unit and policy tests
        run: npm test

      - name: Run exact-head PostgreSQL integration
        run: npm run test:integration

      - name: Refuse a duplicate claim on the same issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPOSITORY" --state open --limit 100 --json number,body > open-pull-requests.json
          node .github/scripts/duplicate-claim-check.mjs open-pull-requests.json "$PR_NUMBER"

      - name: Re-read the exact head before arming
        id: head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$live" != "$TESTED_HEAD" ]; then
            echo "::error::AUTONOMOUS_MERGE_HEAD_MOVED pr=$PR_NUMBER tested=$TESTED_HEAD live=$live"
            exit 1
          fi
          echo "head=$live" >> "$GITHUB_OUTPUT"
          echo "AUTONOMOUS_MERGE_HEAD_CONFIRMED pr=$PR_NUMBER head=$live"

      - name: Arm auto-merge on the verified exact head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ steps.head.outputs.head }}
        run: |
          set -euo pipefail
          if ! gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash \
              --match-head-commit "$HEAD" > merge-arm.log 2>&1; then
            detail="$(tr '\n' ' ' < merge-arm.log | cut -c1-400)"
            echo "::error::AUTONOMOUS_MERGE_ARM_FAILED pr=$PR_NUMBER head=$HEAD reason=$detail"
            exit 1
          fi
          # Two outcomes satisfy this gate on the verified head: an armed
          # auto-merge, or a pull request that is already merged. When the
          # repository has auto-merge disabled, `gh pr merge --auto` merges
          # immediately instead of arming a queue entry; failing that case made
          # a successful merge produce a red gate.
          for attempt in 1 2 3 4 5 6; do
            armed="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.auto_merge != null')"
            if [ "$armed" = "true" ]; then
              echo "AUTONOMOUS_MERGE_ARMED pr=$PR_NUMBER head=$HEAD"
              exit 0
            fi
            merged="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.merged == true')"
            if [ "$merged" = "true" ]; then
              echo "AUTONOMOUS_MERGE_ALREADY_MERGED pr=$PR_NUMBER head=$HEAD attempt=$attempt — no armed auto-merge was available, but this exact head is already merged, so the gate is satisfied."
              exit 0
            fi
            sleep 2
          done
          echo "::error::AUTONOMOUS_MERGE_NOT_ARMED pr=$PR_NUMBER head=$HEAD — GitHub reports neither an armed auto-merge nor a merged pull request for this head."
          exit 1
